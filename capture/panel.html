<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>PANAX capture</title>
<style>
  :root{
    --bg:#121216; --card:#1c1c22; --line:#2c2c35; --text:#ececf1; --muted:#9a9aa8; --dim:#6c6c78;
    --accent:#4ea1ff; --accent2:#3b8fee; --ok:#3ddc97; --warn:#ffb347; --err:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:12px;background:var(--bg);color:var(--text);font:13px/1.45 system-ui,'Malgun Gothic',sans-serif}
  header{display:flex;align-items:baseline;justify-content:space-between;margin:2px 2px 10px}
  header h1{font-size:15px;margin:0;letter-spacing:.01em}
  header small{color:var(--dim);font-size:11px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .card h2{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
  .row{display:flex;gap:6px;align-items:center}
  .row + .row{margin-top:8px}
  label.k{width:52px;flex:none;color:var(--muted);font-size:12px}
  input[type=text],select{flex:1;min-width:0;background:#101014;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;outline:none}
  input[type=text]:focus,select:focus{border-color:var(--accent)}
  button{font:inherit;font-weight:600;border:1px solid var(--line);background:#26262e;color:var(--text);border-radius:8px;padding:7px 10px;cursor:pointer;white-space:nowrap}
  button:hover:not(:disabled){background:#30303a}
  button:disabled{opacity:.45;cursor:default}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover:not(:disabled){background:var(--accent2)}
  .icon{width:34px;padding:7px 0;text-align:center}
  .seg{display:flex;flex:1;background:#101014;border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
  .seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:5px 0;border-radius:6px;font-size:12px}
  .seg button.on{background:var(--accent);color:#fff}
  .status{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;background:#101014;border:1px solid var(--line);margin-bottom:8px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none}
  .on .dot{background:var(--ok);box-shadow:0 0 0 3px rgba(61,220,151,.18)}
  .status .t{flex:1;min-width:0}
  .status .t b{display:block;font-size:13px}
  .status .t small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .big{width:100%;padding:12px;font-size:15px;border-radius:10px}
  .sel{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .sel b{font-size:20px}
  .sel span{color:var(--muted);font-size:12px}
  .keys{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin-top:10px;color:var(--muted);font-size:11.5px}
  kbd{font:600 10.5px system-ui,sans-serif;background:#101014;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--text);white-space:nowrap}
  .chk{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--muted);font-size:12px;cursor:pointer}
  .chk input{accent-color:var(--accent);width:15px;height:15px}
  .shot img{display:block;width:100%;max-height:340px;object-fit:contain;object-position:top;background:#000;border-radius:8px;border:1px solid var(--line)}
  .shot .meta{margin:8px 0;color:var(--muted);font-size:11.5px;word-break:break-all}
  .empty{color:var(--dim);font-size:12px;text-align:center;padding:14px 0}
  .msg{font-size:12px;color:var(--warn);margin-top:8px}
  .msg.err{color:var(--err)}
  .hide{display:none!important}
  footer{display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:11px;margin-top:4px}
  footer button{font-size:11px;padding:5px 8px}
</style>
</head>
<body>
  <header><h1>📸 PANAX capture</h1><small id="ver"></small></header>

  <!-- PAGE -->
  <section class="card">
    <h2>페이지</h2>
    <div class="status" id="status">
      <span class="dot"></span>
      <div class="t"><b id="stTitle">-</b><small id="stSub">-</small></div>
      <button id="toggle">켜기</button>
    </div>
    <div class="row">
      <input type="text" id="url" placeholder="PANAX 링크 · 게시글 번호">
      <button id="go">이동</button>
    </div>
    <div class="row">
      <button class="icon" id="back" title="뒤로">◀</button>
      <button class="icon" id="fwd" title="앞으로">▶</button>
      <button class="icon" id="reload" title="새로고침">⟳</button>
    </div>
  </section>

  <!-- CAPTURE -->
  <section class="card" id="capCard">
    <h2>캡처</h2>
    <div class="sel"><b id="selCount">선택 없음</b><span id="selPx"></span></div>
    <button class="primary big" id="shoot" disabled>📸 캡처</button>
    <div class="row" style="margin-top:8px"><button id="clear" style="flex:1" disabled>선택 해제</button></div>
    <div class="msg hide" id="msg"></div>
    <div class="keys">
      <kbd>클릭</kbd><span>블록 선택</span>
      <kbd>Shift+클릭</kbd><span>블록 추가 · 빼기</span>
      <kbd>↑ ↓</kbd><span>범위 넓히기 · 좁히기 (Alt+휠도 가능)</span>
      <kbd>Enter</kbd><span>캡처</span>
      <kbd>Esc</kbd><span>선택 해제</span>
      <kbd>C</kbd><span>선택 끄기 (링크·탭을 평소처럼 누를 때)</span>
    </div>
  </section>

  <!-- SETTINGS -->
  <section class="card">
    <h2>설정</h2>
    <div class="row"><label class="k">기종</label><select id="device"></select></div>
    <div class="row"><label class="k">배율</label><div class="seg" id="scale"></div></div>
    <div class="row"><label class="k">언어</label><div class="seg" id="lang"></div></div>
    <label class="chk"><input type="checkbox" id="original"> 게시글·댓글은 원문으로 찍기 (화면은 번역 그대로)</label>
    <label class="chk" style="margin-top:6px"><input type="checkbox" id="hideTranslate"> "자동 번역됨 · 원문 보기" 줄 빼고 찍기</label>
    <div class="msg hide" id="setMsg">설정을 바꾸면 페이지가 새로고침됩니다</div>
  </section>

  <!-- LAST SHOT -->
  <section class="card shot">
    <h2>최근 캡처</h2>
    <div class="empty" id="noShot">아직 없음 · 파일은 다운로드/PANAX_capture/에 저장됩니다</div>
    <div class="hide" id="shotBox">
      <img id="shotImg" alt="최근 캡처">
      <div class="meta" id="shotMeta"></div>
      <button id="showFile" style="width:100%">📂 폴더에서 보기</button>
    </div>
  </section>

  <footer><span>파일: 다운로드/PANAX_capture/</span><button id="extReload" title="코드 수정 후 반영">🔄 확장 새로고침</button></footer>

  <script src="panel.js"></script>
</body>
</html>
